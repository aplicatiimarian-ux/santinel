# fly.toml app configuration generated for SANTINEL
# See 'flyctl help launch' for more information about this file.

app = "santinel-api"
primary_region = "iad"

[env]
# Whisper model directory (cached in persistent volume)
HF_HOME = "/data/.cache/huggingface"
# Python optimization
PYTHONUNBUFFERED = "true"

[build]
dockerfile = "Dockerfile"

[[services]]
internal_port = 8000
processes = ["app"]
protocol = "tcp"
script_checks = []

  [services.concurrency]
  hard_limit = 25
  soft_limit = 20

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [[services.tcp_checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"

[mounts]
# Persistent volume for Hugging Face model cache (so model is downloaded once)
source = "santinel_models"
destination = "/data"

[checks]
  [checks.status]
  grace_period = "30s"
  interval = "15s"
  method = "get"
  path = "/health"
  protocol = "http"
  timeout = "5s"

# Pricing: free tier supports 3 shared-cpu-1x 256mb VMs per app
[resources]
  processes = ["app"]

  [resources.limits]
  cpu = 1024      # millicpu (1 vCPU on free tier is 1024)
  memory_mb = 256  # Free tier limit

# Auto-scaling (disabled on free tier)
# [[http_service]]
# auto_stop_machines = true
# auto_start_machines = true
