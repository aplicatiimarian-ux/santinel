# fly.toml app configuration file generated for santinel-api on 2026-09-06T22:50:30+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'santinel-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HF_HOME = '/data/.cache/huggingface'
  PYTHONUNBUFFERED = 'true'

[[mounts]]
  source = 'santinel_models'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
