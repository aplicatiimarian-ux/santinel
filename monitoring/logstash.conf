# ============================================================
# Logstash Configuration for SANTINEL
# ============================================================

input {
  # Receive JSON logs from applications
  tcp {
    port => 5000
    codec => json_lines
    host => "0.0.0.0"
    type => "json"
  }

  # Receive logs from syslog
  udp {
    port => 5001
    codec => plain
    host => "0.0.0.0"
    type => "syslog"
  }

  # File input for Docker container logs
  file {
    path => "/var/log/docker/*.log"
    start_position => "beginning"
    codec => json
    type => "docker"
  }
}

filter {
  # Parse JSON logs
  if [type] == "json" {
    json {
      source => "message"
      target => "data"
      skip_on_invalid_json => true
    }
  }

  # Parse syslog format
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGLINE}"
      }
      add_field => { "parsed" => "true" }
    }
  }

  # Parse Docker container logs
  if [type] == "docker" {
    mutate {
      add_field => { "container_environment" => "docker" }
    }
  }

  # Normalize timestamp
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
    tag_on_failure => [ "_dateparsefailure" ]
  }

  # Extract severity level
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  } else if [severity] {
    mutate {
      add_field => { "level" => "%{severity}" }
      lowercase => [ "level" ]
    }
  }

  # Add standard fields
  mutate {
    add_field => {
      "service" => "santinel"
      "environment" => "production"
      "version" => "1.0"
    }
    remove_field => [ "input_source" ]
  }

  # Geolocation enrichment
  if [client_ip] and [client_ip] != "" {
    geoip {
      source => "client_ip"
      target => "geoip"
      skip_on_empty => true
    }
  }

  # Add request hash for deduplication
  if [message] and [timestamp] {
    fingerprint {
      source => [ "message", "timestamp" ]
      target => "fingerprint"
      method => "MD5"
    }
  }

  # Add processing metadata
  mutate {
    add_field => {
      "processed_at" => "%{@timestamp}"
      "logstash_version" => "8.11.0"
    }
  }
}

output {
  # Send all logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "elastic123"
    index => "santinel-%{+YYYY.MM.dd}"
    document_type => "_doc"
    action => "create"
    retry_on_conflict => 1
  }

  # Send errors to separate index for easier alerting
  if [level] == "error" or [level] == "critical" or [level] == "fatal" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "elastic123"
      index => "santinel-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Send warnings to separate index
  if [level] == "warning" or [level] == "warn" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "elastic123"
      index => "santinel-warnings-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Console output for debugging
  stdout {
    codec => rubydebug
  }
}
