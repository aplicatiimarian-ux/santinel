[pytest]
# Pytest configuration for SANTINEL framework testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Coverage options
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests for individual frameworks
    integration: Integration tests combining multiple frameworks
    bilingual: Tests for bilingual (EN/RO) support
    edge_case: Edge case and error handling tests
    slow: Tests that take a long time to run

# Timeout for tests (in seconds)
timeout = 30

# Minimum Python version
minversion = 3.10
