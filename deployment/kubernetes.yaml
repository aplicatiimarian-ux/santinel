---
# SANTINEL Kubernetes Manifests - Production Deployment
# Usage: kubectl apply -f kubernetes.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: santinel-prod
  labels:
    name: santinel-prod

---
# ConfigMap - Application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: santinel-config
  namespace: santinel-prod
data:
  APP_ENV: "production"
  DEBUG: "False"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://app.santinel.ai,https://www.santinel.ai"
  DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/santinel_prod"
  REDIS_URL: "redis://:redis123@redis:6379/0"
  ANALYTICS_DB_URL: "postgresql://analytics:analytics123@analytics-db:5432/santinel_analytics"

---
# Secret - Sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: santinel-secrets
  namespace: santinel-prod
type: Opaque
stringData:
  JWT_SECRET: "${JWT_SECRET}"
  DB_PASSWORD: "${DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  GROQ_API_KEY: "${GROQ_API_KEY}"
  MISTRAL_API_KEY: "${MISTRAL_API_KEY}"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY}"
  SENTRY_DSN: "${SENTRY_DSN}"

---
# StatefulSet - PostgreSQL Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: santinel-prod
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_DB
          value: santinel_prod
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
# Service - PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: santinel-prod
spec:
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres

---
# Deployment - Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: santinel-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - "--requirepass"
        - "$(REDIS_PASSWORD)"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10

---
# Service - Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: santinel-prod
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis

---
# Deployment - FastAPI Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: santinel-prod
  labels:
    app: api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api
        image: santinel/api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8002
        envFrom:
        - configMapRef:
            name: santinel-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: JWT_SECRET
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: GROQ_API_KEY
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: MISTRAL_API_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: SENTRY_DSN
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]

---
# Service - API (Internal)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: santinel-prod
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8002
    targetPort: 8002
  selector:
    app: api

---
# Service - API (LoadBalancer for external access)
apiVersion: v1
kind: Service
metadata:
  name: api-lb
  namespace: santinel-prod
  labels:
    app: api
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8002
  - name: https
    port: 443
    targetPort: 8002
  selector:
    app: api

---
# Ingress - API Gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: santinel-ingress
  namespace: santinel-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.santinel.ai
    - santinel.ai
    secretName: santinel-tls
  rules:
  - host: api.santinel.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8002
  - host: santinel.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8002

---
# Deployment - Voice Processor
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-processor
  namespace: santinel-prod
  labels:
    app: voice-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-processor
  template:
    metadata:
      labels:
        app: voice-processor
    spec:
      containers:
      - name: voice-processor
        image: santinel/api:latest
        command: ["python", "-u", "core/voice_module.py"]
        envFrom:
        - configMapRef:
            name: santinel-config
        env:
        - name: DEEPGRAM_API_KEY
          valueFrom:
            secretKeyRef:
              name: santinel-secrets
              key: DEEPGRAM_API_KEY
        - name: WORKER_TYPE
          value: "voice_processor"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# HorizontalPodAutoscaler - API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: santinel-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# PodDisruptionBudget - API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: santinel-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api

---
# NetworkPolicy - API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: santinel-prod
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8002
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# ServiceMonitor - Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: santinel-api
  namespace: santinel-prod
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

---
# PrometheusRule - Alerting rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: santinel-alerts
  namespace: santinel-prod
spec:
  groups:
  - name: santinel.rules
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency detected"
    - alert: PodMemoryUsage
      expr: container_memory_usage_bytes{pod=~"api.*"} / container_spec_memory_limit_bytes > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage in pod"
